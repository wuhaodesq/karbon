# Stage 20v · GRU 循环策略 — 时序记忆架构级修复
# 20u 极简验证判决 (9/1 09:23-11:58, 192k 步): 1物体+1墙+固定目标+固定墙+
# 短遮挡+slot全开+教师0.3, 教师完全释放后到达率崩塌到 0.000-0.052。
#   -> 纯前馈策略 (CNN→transformer→MLP) 不具备遮挡导航能力, 问题不在
#      环境复杂度/课程/奖励/信念质量, 在架构本身: 无时序记忆。
# 20v 设计:
#   (a) HierarchicalActorCritic 加 GRU 循环层 (backbone 后, proprio 注入前),
#       隐式跨帧追踪物体位置; belief_head 也从 GRU 输出预测 (获得时序上下文)。
#   (b) rollout 时 GRU 状态逐步传递, episode 边界重置 (状态不跨 episode 泄漏);
#       每步将 forward 前的状态存入 RolloutBuffer (gru_state 字段)。
#   (c) PPO 时用存储的逐步 GRU 状态重算 (模型看到与 rollout 相同的时序上下文);
#       辅助 forward (skill retrieval/off-policy/诊断) 均 update_gru=False,
#       不推进持久状态。
#   (d) 从 20u 192k 权重 resume (GRU 新层随机初始化, strict=False)。
# 配置要点:
#   - use_gru: true (新)
#   - 沿用极简环境 (1 物体 1 墙) 保证信号干净
#   - teacher 0.3 + always_step, 更慢释放 (teacher_step=-0.02, gate 15000)
#   - slot 全开 (无 fade) — 先测 GRU 能否利用完整信息导航
#   - total_steps: 1000000 (短跑)

stage: 20
name: "stage20v_gru"

model:
  hidden_size: 128
  use_hierarchical: true
  use_hybrid_backbone: false
  hybrid_n_layers: 7
  hybrid_n_heads: 4
  hybrid_swa_window: 16
  hybrid_ttt_mini_batch: 8
  hybrid_ffn_hidden_mult: 4
  hybrid_dropout: 0.0
  use_slot_attention: true
  slot_num_slots: 7
  slot_dim: 128
  slot_num_iterations: 3
  use_vision_encoder: false
  sub_goal_every: 10
  use_gru: true

# --- Stage 19: Narrative Loop (disabled for minimal test) ---
narrative:
  enabled: false

# --- Developmental Memory (disabled) ---
developmental_memory:
  enabled: false

# --- 3D Environment (MuJoCo) — 极简配置 ---
env:
  id: "ThreeDWorld"
  num_objects: 1           # 只 1 个目标物体
  max_episode_steps: 100   # 短 episode
  render_size: 128
  action_force: 50.0
  developmental_age: 0.5
  num_envs: 1
  num_occluders: 1         # 只 1 堵遮挡墙
  occluder_trace: false
  occluder_target_reward: 3.0
  occluder_shaping_weight: 3.0
  occluder_reveal_bonus: 8.0
  occluder_reveal_ratio: 0.70
  occluder_reveal_ratio_ladder: [0.70]
  occluder_reveal_ratio_ladder_every: 500000
  occluder_reach_reward: 20.0
  occluder_reach_radius: 0.8
  occluder_reward_radius: 0.8
  occluder_reward_radius_ladder: [0.8]
  occluder_reward_radius_threshold: 0.7
  occluder_reward_radius_rounds: 3
  occluder_reach_hold: 2.0
  occluder_orient_weight: 1.5
  occluder_orient_bonus: 8.0
  occluder_orient_gate_every: 15000
  occluder_orient_threshold: 0.25
  occluder_orient_rounds_needed: 3
  # 极简遮挡: 每 30 步穿越一次, 只停 10 步 (短遮挡)
  object_crossing_every: 30
  object_crossing_hold_steps: 10
  object_crossing_fixed_object: 0   # 固定第 0 个物体
  object_crossing_fixed_wall: 0     # 固定第 0 堵墙
  occluder_obs_slots: 3
  # 教师: 中等强度引导 + 慢速强制释放 (更稳的课程)
  occluder_teacher_force: 0.3
  occluder_teacher_min: 0.0
  occluder_teacher_gate_every: 15000
  occluder_teacher_probe_steps: 2000
  occluder_teacher_arrival_threshold: 0.15
  occluder_teacher_rounds_needed: 2
  occluder_teacher_step: -0.02
  occluder_teacher_always_step: true
  # belief: slot 全开 (不 fade), 测 GRU 能否用完整信息导航
  occluder_belief_loss_weight: 0.0   # 20v 先测纯 GRU, 不开 belief loss
  occluder_slot_fade_start: 0
  occluder_slot_fade_steps: 0        # fade=0 恒定, slot 100% 可见
  focus_op_only: true

# --- LLM Fusion (disabled) ---
llm_fusion:
  enabled: false

# --- Advanced Cognition (minimal) ---
advanced:
  counterfactual_enabled: false
  behavior_cloning_enabled: false
  meta_learner_enabled: false
  hypothesis_tester_enabled: false

# --- Cognitive Modules (minimal) ---
cognitive:
  symbolic_enabled: false
  self_model_enabled: false
  logic_engine_enabled: false
  reflection_enabled: false

theory_of_mind:
  enabled: false

creativity:
  enabled: false

# --- Stage 16: Symbol Backend (disabled) ---
symbol_backend:
  enabled: false

# --- Neuro-Symbolic Bridge (disabled) ---
neuro_symbolic_bridge:
  enabled: false

# --- Abstract Reasoning (disabled) ---
abstract_reasoning:
  enabled: false

# --- 3D Curriculum (single task, no switching) ---
curriculum:
  max_tasks: 1
  lp_window_size: 32
  lp_min_samples: 8
  exploration_epsilon: 0.3
  mode: sequential
  switch_every_steps: 999999999   # 永不切换
  report_every_steps: 500
  tasks:
    - {id: 0, num_objects: 1, action_force: 50.0, difficulty: 0.1, tag: "3d-minimal"}

# --- Core modules (minimal) ---
continual:
  ewc_lambda: 0.0          # 关 EWC (短跑不需要)
  ewc_gamma: 0.99
  ewc_anchor_mode: "replace"
  ewc_anchor_ema_alpha: 0.9
  ewc_consolidate_every_steps: 999999999
  ewc_consolidate_num_batches: 32
  ewc_batch_size: 32
  gr_enabled: false
  sleep_warmup_steps: 999999999
  sleep_replay_trim_every: 999999999
  sleep_skills_merge_every: 999999999
  sleep_ttt_distill_every: 999999999

core_knowledge_loss:
  enabled: false

# --- External Memory System (disabled) ---
external_memory:
  enabled: false

# --- Causal Discovery (disabled) ---
causal_discovery:
  enabled: false

# --- Number Sense (disabled) ---
number_sense:
  enabled: false

# --- Rule Induction (disabled) ---
rule_induction:
  enabled: false

# --- Skills (disabled) ---
skills:
  skill_d_out: 128
  skill_d_in: 128
  skill_rank: 8
  gpu_capacity: 256
  cpu_capacity: 2048
  ssd_max_shards: 64
  ssd_shard_size: 128
  merge_similarity_threshold: 0.9
  score_alpha: 1.0
  score_beta: 0.5
  score_gamma: 0.1
  archive_subdir: "skills"

# --- World Model (disabled for minimal test) ---
world_model:
  z_dim: 32
  h_dim: 64
  embed_dim: 64
  hidden: 128
  max_rollout_steps: 10
  kl_free_nats: 0.0
  recon_loss_weight: 0.0   # 关 WM loss
  recon_pixel_weight: 0.0
  next_loss_coef: 0.0
  update_every_steps: 999999999
  lr: 5.0e-4
  wm_loss_coef: 0.0
  log_every_steps: 999999999

# --- Imagination Training (disabled) ---
imagination:
  enabled: false

intrinsic:
  embed_dim: 128
  lr: 1.0e-4
  reward_clip: 5.0
  reward_coef: 0.0         # 关 intrinsic reward
  update_every_steps: 999999999

replay:
  hot_capacity: 16384
  warm_capacity: 131072
  cold_max_shards: 6
  cold_shard_size: 16384
  per_alpha: 0.6
  min_size_to_sample: 256
  sample_every_steps: 999999999  # 关 replay
  batch_size_offpolicy: 128
  archive_subdir: "replay"

coverage:
  num_buckets: 16384
  log_every_steps: 999999999

# --- Training (GRU 短跑: 1M 步, resume 20u 192k) ---
train:
  ppo_clip: 0.2
  ppo_epochs: 4
  entropy_coef: 0.03
  value_coef: 0.5
  bc_teacher_coef: 0.2
  gamma: 0.99
  gae_lambda: 0.95
  total_steps: 1000000
  ckpt_every_steps: 50000

independent_eval:
  eval_every_steps: 50000
  eval_weights: [2.0, 1.0, 2.0]
  episodes_per_task: 5
  max_steps_per_ep: 100
  eval_epsilon: 0.05
  eval_seed: 42

viz:
  frame_every_steps: 10000
