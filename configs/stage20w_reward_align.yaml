# Stage 20w · 奖励对齐 + 课程学习 — 让"到达"成为唯一高分途径
# 20v GRU 判决 (9/1 20:20, 737k 步): 教师完全释放后到达率 0.033, mean_ret
#   从 78 升到 95 但到达率不变 → 策略在学"靠近但不进入"(reward hacking),
#   而非"追踪并到达"。
# 根因分析 (奖励结构):
#   - "靠近"策略: orient 1.5×100 + target 3.0×100 + shaping 3.0×100 ≈ 750/episode
#   - "到达"策略: reach 20 + hold 2×10 ≈ 40/episode
#   - PPO 理性选择"靠近" —— 不是学错了, 是奖励结构下的最优解。
#   - 且 reward clamp 到 5.0 (L1786), reach=20 实际只有 5 → 差距更小。
# 20w 修复:
#   (a) 奖励重设计: reach 20→100, orient/target/shaping 降到 0.1-0.3,
#       clamp 5→50 → "到达"回报 (100+) 压倒 "靠近"回报 (~70)。
#   (b) 课程 3 阶段: 无遮挡(0-200k) → 短遮挡(200k-500k) → 正常遮挡(500k-1M)。
#       先学会基本导航, 再泛化到遮挡场景。
#   (c) GRU 保留 (20v 已加载), 时序记忆 + 对齐奖励 → 双管齐下。

stage: 20
name: "stage20w_reward_align"

model:
  hidden_size: 128
  use_hierarchical: true
  use_hybrid_backbone: false
  hybrid_n_layers: 7
  hybrid_n_heads: 4
  hybrid_swa_window: 16
  hybrid_ttt_mini_batch: 8
  hybrid_ffn_hidden_mult: 4
  hybrid_dropout: 0.0
  use_slot_attention: true
  slot_num_slots: 7
  slot_dim: 128
  slot_num_iterations: 3
  use_vision_encoder: false
  sub_goal_every: 10
  use_gru: true

# --- Stage 19: Narrative Loop (disabled) ---
narrative:
  enabled: false

# --- Developmental Memory (disabled) ---
developmental_memory:
  enabled: false

# --- 3D Environment (MuJoCo) — 极简 + 奖励对齐 ---
env:
  id: "ThreeDWorld"
  num_objects: 1
  max_episode_steps: 100
  render_size: 128
  action_force: 50.0
  developmental_age: 0.5
  num_envs: 1
  num_occluders: 1
  occluder_trace: false
  # 20w 奖励重设计: 到达压倒一切
  occluder_target_reward: 0.3       # was 3.0 → 降到 1/10
  occluder_shaping_weight: 0.3      # was 3.0 → 降到 1/10
  occluder_reveal_bonus: 2.0        # was 8.0 → 降低
  occluder_reveal_ratio: 0.70
  occluder_reveal_ratio_ladder: [0.70]
  occluder_reveal_ratio_ladder_every: 500000
  occluder_reach_reward: 100.0      # was 20.0 → 提高 5x, 到达压倒一切
  occluder_reach_radius: 0.8
  occluder_reward_radius: 0.8
  occluder_reward_radius_ladder: [0.8]
  occluder_reward_radius_threshold: 0.7
  occluder_reward_radius_rounds: 3
  occluder_reach_hold: 5.0          # was 2.0 → 提高
  occluder_orient_weight: 0.1       # was 1.5 → 降到 1/15
  occluder_orient_bonus: 2.0        # was 8.0 → 降低
  occluder_orient_gate_every: 15000
  occluder_orient_threshold: 0.25
  occluder_orient_rounds_needed: 3
  # 遮挡事件参数
  object_crossing_every: 30
  object_crossing_hold_steps: 10
  object_crossing_fixed_object: 0
  object_crossing_fixed_wall: 0
  occluder_obs_slots: 3
  # 教师: 中等强度 + 慢速释放
  occluder_teacher_force: 0.3
  occluder_teacher_min: 0.0
  occluder_teacher_gate_every: 15000
  occluder_teacher_probe_steps: 2000
  occluder_teacher_arrival_threshold: 0.15
  occluder_teacher_rounds_needed: 2
  occluder_teacher_step: -0.02
  occluder_teacher_always_step: true
  # belief/GRU: slot 全开, 不开 belief loss (测纯 GRU + 对齐奖励)
  occluder_belief_loss_weight: 0.0
  occluder_slot_fade_start: 0
  occluder_slot_fade_steps: 0
  focus_op_only: true  # 阶段 2/3 用; 阶段 1 由 spec 覆盖为 false

# --- LLM Fusion (disabled) ---
llm_fusion:
  enabled: false

# --- Advanced Cognition (minimal) ---
advanced:
  counterfactual_enabled: false
  behavior_cloning_enabled: false
  meta_learner_enabled: false
  hypothesis_tester_enabled: false

# --- Cognitive Modules (minimal) ---
cognitive:
  symbolic_enabled: false
  self_model_enabled: false
  logic_engine_enabled: false
  reflection_enabled: false

theory_of_mind:
  enabled: false

creativity:
  enabled: false

# --- Stage 16: Symbol Backend (disabled) ---
symbol_backend:
  enabled: false

# --- Neuro-Symbolic Bridge (disabled) ---
neuro_symbolic_bridge:
  enabled: false

# --- Abstract Reasoning (disabled) ---
abstract_reasoning:
  enabled: false

# --- 3D Curriculum: 3 阶段 (无遮挡→短遮挡→正常遮挡) ---
curriculum:
  max_tasks: 3
  lp_window_size: 32
  lp_min_samples: 8
  exploration_epsilon: 0.3
  mode: sequential
  switch_every_steps: 500000   # 每 500k 步切换
  report_every_steps: 500
  tasks:
    # 阶段 1 (0-500k): 无遮挡, 学基本导航 (不 lock focus_op_only, 基础奖励驱动)
    - id: 0
      num_objects: 1
      num_occluders: 0          # 无遮挡
      focus_op_only: false      # 基础奖励 (物体交互/接触) 驱动基本导航学习
      action_force: 50.0
      difficulty: 0.1
      tag: "3d-no-occ"
      occluder_reach_reward: 100.0
      occluder_reach_hold: 5.0
      occluder_target_reward: 0.3
      occluder_shaping_weight: 0.3
      occluder_orient_weight: 0.1
      occluder_orient_bonus: 2.0
      occluder_reveal_bonus: 2.0
      occluder_teacher_force: 0.3
    # 阶段 2 (500k-1M): 短遮挡 (5步), 学遮挡导航
    - id: 1
      num_objects: 1
      num_occluders: 1
      object_crossing_hold_steps: 5
      action_force: 50.0
      difficulty: 0.3
      tag: "3d-short-occ"
      occluder_reach_reward: 100.0
      occluder_reach_hold: 5.0
      occluder_target_reward: 0.3
      occluder_shaping_weight: 0.3
      occluder_orient_weight: 0.1
      occluder_orient_bonus: 2.0
      occluder_reveal_bonus: 2.0
      occluder_teacher_force: 0.3
    # 阶段 3 (1M-1.5M): 正常遮挡 (10步), 完整挑战
    - id: 2
      num_objects: 1
      num_occluders: 1
      object_crossing_hold_steps: 10
      action_force: 50.0
      difficulty: 0.5
      tag: "3d-normal-occ"
      occluder_reach_reward: 100.0
      occluder_reach_hold: 5.0
      occluder_target_reward: 0.3
      occluder_shaping_weight: 0.3
      occluder_orient_weight: 0.1
      occluder_orient_bonus: 2.0
      occluder_reveal_bonus: 2.0
      occluder_teacher_force: 0.3

# --- Core modules (minimal) ---
continual:
  ewc_lambda: 0.0
  ewc_gamma: 0.99
  ewc_anchor_mode: "replace"
  ewc_anchor_ema_alpha: 0.9
  ewc_consolidate_every_steps: 999999999
  ewc_consolidate_num_batches: 32
  ewc_batch_size: 32
  gr_enabled: false
  sleep_warmup_steps: 999999999
  sleep_replay_trim_every: 999999999
  sleep_skills_merge_every: 999999999
  sleep_ttt_distill_every: 999999999

core_knowledge_loss:
  enabled: false

# --- External Memory System (disabled) ---
external_memory:
  enabled: false

# --- Causal Discovery (disabled) ---
causal_discovery:
  enabled: false

# --- Number Sense (disabled) ---
number_sense:
  enabled: false

# --- Rule Induction (disabled) ---
rule_induction:
  enabled: false

# --- Skills (disabled) ---
skills:
  skill_d_out: 128
  skill_d_in: 128
  skill_rank: 8
  gpu_capacity: 256
  cpu_capacity: 2048
  ssd_max_shards: 64
  ssd_shard_size: 128
  merge_similarity_threshold: 0.9
  score_alpha: 1.0
  score_beta: 0.5
  score_gamma: 0.1
  archive_subdir: "skills"

# --- World Model (disabled) ---
world_model:
  z_dim: 32
  h_dim: 64
  embed_dim: 64
  hidden: 128
  max_rollout_steps: 10
  kl_free_nats: 0.0
  recon_loss_weight: 0.0
  recon_pixel_weight: 0.0
  next_loss_coef: 0.0
  update_every_steps: 999999999
  lr: 5.0e-4
  wm_loss_coef: 0.0
  log_every_steps: 999999999

# --- Imagination Training (disabled) ---
imagination:
  enabled: false

intrinsic:
  embed_dim: 128
  lr: 1.0e-4
  reward_clip: 5.0
  reward_coef: 0.0
  update_every_steps: 999999999

replay:
  hot_capacity: 16384
  warm_capacity: 131072
  cold_max_shards: 6
  cold_shard_size: 16384
  per_alpha: 0.6
  min_size_to_sample: 256
  sample_every_steps: 999999999
  batch_size_offpolicy: 128
  archive_subdir: "replay"

coverage:
  num_buckets: 16384
  log_every_steps: 999999999

# --- Training (20w: 1.5M 步, 从头开始) ---
train:
  ppo_clip: 0.2
  ppo_epochs: 4
  entropy_coef: 0.03
  value_coef: 0.5
  bc_teacher_coef: 0.2
  gamma: 0.99
  gae_lambda: 0.95
  total_steps: 1500000
  ckpt_every_steps: 50000

independent_eval:
  eval_every_steps: 50000
  eval_weights: [2.0, 1.0, 2.0]
  episodes_per_task: 5
  max_steps_per_ep: 100
  eval_epsilon: 0.05
  eval_seed: 42

viz:
  frame_every_steps: 10000
