# Stage 12 · Imagination-Driven Training (Dreamer-style)
# Makes the ImaginationTrainer the primary learning driver.
# The RSSM world model (recon≈0.000) is mature enough to support
# high-fidelity imagined rollouts — let the agent "think more" before acting.
#
# Key differences from Stage 11:
# 1. imagination_horizon: 8 → 15 (Dreamer-standard planning horizon)
# 2. imagination_batch: 32 → 128 (more parallel imagined trajectories)
# 3. update_every_steps: 16 → 4 (imagination runs ~every 4 env steps)
# 4. M2 skill retrieval is active — imagined trajectories seed new skills
#
# Target: verify that imagination-driven training improves sample efficiency
# 2-3x on MiniGrid tasks vs Stage 11 baseline.

stage: 12
name: "stage12_imagination_driven"

model:
  hidden_size: 128
  use_hierarchical: true
  use_hybrid_backbone: false
  hybrid_n_layers: 7
  hybrid_n_heads: 4
  hybrid_swa_window: 16
  hybrid_ttt_mini_batch: 8
  hybrid_ffn_hidden_mult: 4
  hybrid_dropout: 0.0
  use_slot_attention: true
  slot_num_slots: 7
  slot_dim: 128
  slot_num_iterations: 3
  use_vision_encoder: false
  sub_goal_every: 10

env:
  id: "MiniGrid-DoorKey-5x5-v0"
  render_size: 64
  action_force: 50.0
  num_envs: 1

# --- LLM Fusion (Qwen-7B) ---
llm_fusion:
  enabled: true
  model: "Qwen/Qwen2.5-7B-Instruct"
  max_new_tokens: 64
  call_interval_steps: 50

# --- Cognitive Modules ---
cognitive:
  symbolic_enabled: true
  symbolic_max_rules: 64
  symbolic_bias_weight: 0.5
  self_model_enabled: true
  self_model_d_model: 384
  self_model_hidden: 64
  logic_engine_enabled: true
  logic_max_rules: 64
  logic_max_variables: 16
  reflection_enabled: true
  reflection_max: 256
  reflection_every_episodes: 200

theory_of_mind:
  enabled: false

creativity:
  enabled: true
  trigger_every_steps: 20000
  divergent_generator_enabled: true
  transformational_enabled: true
  transformational_max: 32

# --- MiniGrid curriculum ---
curriculum:
  max_tasks: 5
  lp_window_size: 32
  lp_min_samples: 8
  exploration_epsilon: 0.3
  mode: sequential
  smoothing: 0.5
  switch_every_steps: 50000
  report_every_steps: 500
  tasks:
    - {id: 0, env_id: "MiniGrid-Empty-5x5-v0",  difficulty: 0.1, tag: "empty-5x5",   switch_every: 25000}
    - {id: 1, env_id: "MiniGrid-Empty-8x8-v0",  difficulty: 0.3, tag: "empty-8x8",   switch_every: 25000}
    - {id: 2, env_id: "MiniGrid-DoorKey-5x5-v0", difficulty: 0.5, tag: "doorkey-5x5", switch_every: 80000}

# --- Core modules ---
continual:
  ewc_lambda: 3.0
  ewc_gamma: 0.95
  ewc_anchor_mode: "replace"
  ewc_anchor_ema_alpha: 0.9
  ewc_consolidate_every_steps: 100000
  ewc_consolidate_num_batches: 32
  ewc_batch_size: 32
  gr_enabled: true
  gr_latent_dim: 64
  gr_hidden: 128
  gr_lr: 1.0e-3
  gr_kl_weight: 1.0
  gr_update_every_steps: 16
  gr_batch_size: 32
  gr_rehearsal_batch_size: 32
  gr_inject_every_steps: 5000
  sleep_warmup_steps: 1000
  sleep_replay_trim_every: 10000
  sleep_skills_merge_every: 20000
  sleep_ttt_distill_every: 20000

core_knowledge_loss:
  enabled: true
  coef_object_permanence: 0.1
  coef_intuitive_physics: 0.1
  coef_number_sense: 0.1

# --- Imagination: the star of Stage 12 ---
imagination:
  enabled: true
  imagination_horizon: 15       # Dreamer-standard planning horizon
  imagination_batch: 128         # more parallel trajectories = more stable
  discount: 0.99
  actor_entropy_scale: 0.01
  critic_loss_scale: 0.5
  update_every_steps: 4          # ~every 4 env steps
  min_replay_size: 256
  lambda_gae: 0.95
  lr: 3.0e-4

homeostatic_drives:
  enabled: true
  curiosity_decay: 0.002
  competence_decay: 0.001
  social_decay: 0.003
  safety_decay: 0.001
  rest_decay: 0.005

emotion_system:
  enabled: true
  pleasure_decay: 0.01
  frustration_decay: 0.02
  surprise_decay: 0.05
  fear_decay: 0.03

causal_discovery:
  enabled: true
  max_edges: 256
  min_intervention_effect: 0.01

number_sense:
  enabled: true
  max_count: 20
  hidden: 32
  lr: 3.0e-4

rule_induction:
  enabled: true
  max_rules: 128
  max_chain_depth: 5
  min_confidence: 0.3
  induction_min_positive: 3

skills:
  skill_d_out: 128
  skill_d_in: 128
  skill_rank: 8
  gpu_capacity: 256
  cpu_capacity: 2048
  ssd_max_shards: 64
  ssd_shard_size: 128
  merge_similarity_threshold: 0.9
  score_alpha: 1.0
  score_beta: 0.5
  score_gamma: 0.1
  archive_subdir: "skills"

world_model:
  z_dim: 32
  h_dim: 64
  embed_dim: 64
  hidden: 128
  max_rollout_steps: 10
  kl_free_nats: 0.5
  update_every_steps: 8
  lr: 3.0e-4
  wm_loss_coef: 1.0
  log_every_steps: 5000

intrinsic:
  embed_dim: 128
  lr: 1.0e-4
  reward_clip: 5.0
  reward_coef: 0.5
  update_every_steps: 1

replay:
  hot_capacity: 16384
  warm_capacity: 131072
  cold_max_shards: 32
  cold_shard_size: 16384
  per_alpha: 0.6
  min_size_to_sample: 1024
  sample_every_steps: 4
  batch_size_offpolicy: 128
  archive_subdir: "replay"

coverage:
  num_buckets: 16384
  log_every_steps: 5000

train:
  ppo_clip: 0.2
  ppo_epochs: 4
  entropy_coef: 0.04
  value_coef: 0.5
  gamma: 0.99
  gae_lambda: 0.95
  total_steps: 1000000
  ckpt_every_steps: 25000

independent_eval:
  eval_every_steps: 25000
  eval_weights: [2.0, 1.0, 2.0]
  episodes_per_task: 5
  max_steps_per_ep: 200

viz:
  frame_every_steps: 0
