# Stage 12 · 想象训练 (Imagination Training)
# 基于 Stage 15 的 3D 世界模型 + 完整因果图谱
#
# 核心目标: 用 WM 生成想象轨迹,提升样本效率
# 之前 MiniGrid 中想象训练无效(WM 未学习),现在 3D WM 已学习(Recon 1.68)
# 因果图已完成(23/64 边),可指导想象中的物理合理性
#
# 关键验证:
# 1. 想象帧质量 (WM decode 的未来帧是否合理)
# 2. 想象训练是否提升样本效率 (vs 纯真实数据)
# 3. 因果图是否指导想象 (想象中遵循物理因果)

stage: 12
name: "stage12_imagination"

model:
  hidden_size: 128
  use_hierarchical: true
  use_hybrid_backbone: false
  hybrid_n_layers: 7
  hybrid_n_heads: 4
  hybrid_swa_window: 16
  hybrid_ttt_mini_batch: 8
  hybrid_ffn_hidden_mult: 4
  hybrid_dropout: 0.0
  use_slot_attention: true
  slot_num_slots: 7
  slot_dim: 128
  slot_num_iterations: 3
  use_vision_encoder: false
  sub_goal_every: 10

# --- 3D Environment (MuJoCo) ---
env:
  id: "ThreeDWorld"
  num_objects: 8
  max_episode_steps: 300
  render_size: 128
  action_force: 50.0
  developmental_age: 0.35             # toddler: grasping + chain tasks unlocked
  num_envs: 1

# --- LLM Fusion (disabled) ---
llm_fusion:
  enabled: false

# --- Advanced Cognition ---
advanced:
  counterfactual_enabled: true
  counterfactual_max_steps: 5
  counterfactual_every_steps: 250
  behavior_cloning_enabled: false
  meta_learner_enabled: false

# --- Cognitive Modules ---
cognitive:
  symbolic_enabled: true
  symbolic_max_rules: 64
  symbolic_bias_weight: 0.5
  self_model_enabled: true
  self_model_d_model: 384
  self_model_hidden: 64
  logic_engine_enabled: true
  logic_max_rules: 64
  logic_max_variables: 16
  reflection_enabled: true
  reflection_max: 256
  reflection_every_episodes: 200

theory_of_mind:
  enabled: false

creativity:
  enabled: true
  trigger_every_steps: 20000
  divergent_generator_enabled: true
  transformational_enabled: true
  transformational_max: 32

# --- 3D Curriculum (保持 Stage 15 课程) ---
curriculum:
  max_tasks: 5
  lp_window_size: 32
  lp_min_samples: 8
  exploration_epsilon: 0.3
  mode: sequential
  smoothing: 0.5
  switch_every_steps: 50000
  report_every_steps: 500
  tasks:
    - {id: 0, num_objects: 3,  action_force: 70.0, difficulty: 0.1, tag: "3d-sparse"}
    - {id: 1, num_objects: 5,  action_force: 60.0, difficulty: 0.3, tag: "3d-few"}
    - {id: 2, num_objects: 8,  action_force: 50.0, difficulty: 0.5, tag: "3d-base"}
    - {id: 3, num_objects: 12, action_force: 45.0, difficulty: 0.7, tag: "3d-many"}
    - {id: 4, num_objects: 16, action_force: 40.0, difficulty: 0.9, tag: "3d-crowded"}

# --- Core modules (carry-forward from Stage 15) ---
continual:
  ewc_lambda: 50.0
  ewc_gamma: 0.99
  ewc_anchor_mode: "replace"
  ewc_anchor_ema_alpha: 0.9
  ewc_consolidate_every_steps: 50000
  ewc_consolidate_num_batches: 32
  ewc_batch_size: 32
  gr_enabled: true
  gr_latent_dim: 64
  gr_hidden: 128
  gr_lr: 1.0e-3
  gr_kl_weight: 1.0
  gr_update_every_steps: 16
  gr_batch_size: 32
  gr_rehearsal_batch_size: 32
  gr_inject_every_steps: 5000
  sleep_warmup_steps: 1000
  sleep_replay_trim_every: 25000
  sleep_skills_merge_every: 50000
  sleep_ttt_distill_every: 50000

core_knowledge_loss:
  enabled: true
  coef_object_permanence: 0.1
  coef_intuitive_physics: 0.1
  coef_number_sense: 0.1

# --- External Memory System ---
external_memory:
  enabled: true

  surprise_detector:
    rnd_weight: 0.3
    rssm_weight: 0.3
    coverage_weight: 0.2
    rnd_embed_dim: 128
    rnd_hidden_dim: 256
    rnd_lr: 1.0e-4
    rnd_gamma: 0.99
    surprise_threshold: 0.5
    cooldown_steps: 100

  episodic_memory:
    capacity: 4096
    embed_dim: 128
    similarity_threshold: 0.7
    lr: 1.0e-4

  semantic_memory:
    capacity: 512
    embed_dim: 128
    lr: 5.0e-5

  procedural_memory:
    capacity: 256
    embed_dim: 128
    lr: 1.0e-4

# --- Causal Discovery (carry-forward from Stage 15, 完成) ---
causal_discovery:
  enabled: true
  mode: "experience"
  buffer_capacity: 8192
  intervene_every: 250
  max_edges: 512
  min_intervention_effect: 0.005
  min_strength: 0.005

# --- Number Sense ---
number_sense:
  enabled: true
  max_count: 20
  hidden: 32
  lr: 3.0e-4

# --- Rule Induction ---
rule_induction:
  enabled: true
  max_rules: 128
  max_chain_depth: 5
  min_confidence: 0.3
  induction_min_positive: 3

# --- Skills (carry-forward) ---
skills:
  skill_d_out: 128
  skill_d_in: 128
  skill_rank: 8
  gpu_capacity: 256
  cpu_capacity: 2048
  ssd_max_shards: 64
  ssd_shard_size: 128
  merge_similarity_threshold: 0.9
  score_alpha: 1.0
  score_beta: 0.5
  score_gamma: 0.1
  archive_subdir: "skills"

# --- World Model (KEY: 想象训练启用) ---
world_model:
  z_dim: 32
  h_dim: 64
  embed_dim: 64
  hidden: 128
  max_rollout_steps: 10
  kl_free_nats: 0.0
  recon_loss_weight: 1.0
  recon_pixel_weight: 200.0
  next_loss_coef: 2.0
  update_every_steps: 4
  lr: 5.0e-4
  wm_loss_coef: 1.0
  log_every_steps: 2000

# --- Imagination Training (KEY: Stage 12 核心) ---
imagination:
  enabled: true                    # 启用想象训练
  imagination_horizon: 10          # 想象轨迹长度
  imagination_batch: 32            # 并行想象轨迹数
  discount: 0.99                   # gamma
  actor_entropy_scale: 0.01        # 熵奖励权重
  critic_loss_scale: 0.5           # TD-error 权重
  update_every_steps: 4            # 每 N 步更新一次 (原8,翻倍想象训练频率)
  min_replay_size: 64              # 最小回放缓冲 (原256,降低4x)
  lambda_gae: 0.95                 # GAE lambda
  lr: 3.0e-4                       # 学习率

intrinsic:
  embed_dim: 128
  lr: 1.0e-4
  reward_clip: 5.0
  reward_coef: 0.5
  update_every_steps: 1

replay:
  hot_capacity: 16384
  warm_capacity: 131072
  cold_max_shards: 32
  cold_shard_size: 16384
  per_alpha: 0.6
  min_size_to_sample: 256              # 原1024,降低4x让想象训练更早启动
  sample_every_steps: 4
  batch_size_offpolicy: 128
  archive_subdir: "replay"

coverage:
  num_buckets: 16384
  log_every_steps: 10000

# --- Training (full: 1M steps) ---
train:
  ppo_clip: 0.2
  ppo_epochs: 4
  entropy_coef: 0.04
  value_coef: 0.5
  gamma: 0.99
  gae_lambda: 0.95
  total_steps: 1000000             # full training
  ckpt_every_steps: 50000

independent_eval:
  eval_every_steps: 50000
  eval_weights: [2.0, 1.0, 2.0]
  episodes_per_task: 5
  max_steps_per_ep: 200
  eval_epsilon: 0.05
  eval_seed: 42

viz:
  frame_every_steps: 10000
