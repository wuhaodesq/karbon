# Stage 15 · 3D Core Knowledge (ThreeDWorld 迁移 + 物体永存/物理)
# Resumes from Stage 14 ckpt (1M steps, MiniGrid sealed).
#
# Key changes vs Stage 14:
# 1. Environment: MiniGrid → ThreeDWorld (MuJoCo 3D, high-information pixels)
# 2. World model: latent-only → pixel recon re-enabled (encode cost < recon gain
#    in 3D, proven by rendering info density: unique=3431 vs 9 in MiniGrid)
# 3. Curriculum: MiniGrid tasks → 3D physics tasks (varying object count/density)
# 4. Carry-forward: EWC λ=50 γ=0.99, causal experience mode, skill library
#
# Smoke test config (50K steps): verify WM recon loss下降 in 3D.

stage: 15
name: "stage15_3d_core_knowledge"

model:
  hidden_size: 128
  use_hierarchical: true
  use_hybrid_backbone: false
  hybrid_n_layers: 7
  hybrid_n_heads: 4
  hybrid_swa_window: 16
  hybrid_ttt_mini_batch: 8
  hybrid_ffn_hidden_mult: 4
  hybrid_dropout: 0.0
  use_slot_attention: true
  slot_num_slots: 7
  slot_dim: 128
  slot_num_iterations: 3
  use_vision_encoder: false
  sub_goal_every: 10

# --- 3D Environment (MuJoCo) ---
env:
  id: "ThreeDWorld"
  num_objects: 8
  max_episode_steps: 300
  render_size: 128          # close-up camera verified optimal (unique=3431)
  action_force: 50.0
  developmental_age: 0.0    # infant
  num_envs: 1

# --- LLM Fusion (disabled for 3D stage — no language grounding yet) ---
llm_fusion:
  enabled: false

# --- Advanced Cognition ---
advanced:
  counterfactual_enabled: true
  counterfactual_max_steps: 5
  counterfactual_every_steps: 500
  behavior_cloning_enabled: false
  meta_learner_enabled: false

# --- Cognitive Modules ---
cognitive:
  symbolic_enabled: true
  symbolic_max_rules: 64
  symbolic_bias_weight: 0.5
  self_model_enabled: true
  self_model_d_model: 384
  self_model_hidden: 64
  logic_engine_enabled: true
  logic_max_rules: 64
  logic_max_variables: 16
  reflection_enabled: true
  reflection_max: 256
  reflection_every_episodes: 200

theory_of_mind:
  enabled: false

creativity:
  enabled: true
  trigger_every_steps: 20000
  divergent_generator_enabled: true
  transformational_enabled: true
  transformational_max: 32

# --- 3D Curriculum (physics tasks by object density) ---
curriculum:
  max_tasks: 5
  lp_window_size: 32
  lp_min_samples: 8
  exploration_epsilon: 0.3
  mode: sequential
  smoothing: 0.5
  switch_every_steps: 20000
  report_every_steps: 500
  tasks:
    - {id: 0, num_objects: 3,  action_force: 70.0, difficulty: 0.1, tag: "3d-sparse"}
    - {id: 1, num_objects: 5,  action_force: 60.0, difficulty: 0.3, tag: "3d-few"}
    - {id: 2, num_objects: 8,  action_force: 50.0, difficulty: 0.5, tag: "3d-base"}
    - {id: 3, num_objects: 12, action_force: 45.0, difficulty: 0.7, tag: "3d-many"}
    - {id: 4, num_objects: 16, action_force: 40.0, difficulty: 0.9, tag: "3d-crowded"}

# --- Core modules (carry-forward from Stage 14) ---
continual:
  ewc_lambda: 50.0
  ewc_gamma: 0.99
  ewc_anchor_mode: "replace"
  ewc_anchor_ema_alpha: 0.9
  ewc_consolidate_every_steps: 25000
  ewc_consolidate_num_batches: 32
  ewc_batch_size: 32
  gr_enabled: true
  gr_latent_dim: 64
  gr_hidden: 128
  gr_lr: 1.0e-3
  gr_kl_weight: 1.0
  gr_update_every_steps: 16
  gr_batch_size: 32
  gr_rehearsal_batch_size: 32
  gr_inject_every_steps: 5000
  sleep_warmup_steps: 1000
  sleep_replay_trim_every: 10000
  sleep_skills_merge_every: 20000
  sleep_ttt_distill_every: 20000

core_knowledge_loss:
  enabled: true
  coef_object_permanence: 0.1    # 直接在 3D 中验证
  coef_intuitive_physics: 0.1    # 真实物理因果
  coef_number_sense: 0.1

# --- External Memory System ---
external_memory:
  enabled: true

  surprise_detector:
    rnd_weight: 0.3
    rssm_weight: 0.3
    coverage_weight: 0.2
    rnd_embed_dim: 128
    rnd_hidden_dim: 256
    rnd_lr: 1.0e-4
    rnd_gamma: 0.99
    surprise_threshold: 0.5
    cooldown_steps: 100

  episodic_memory:
    capacity: 4096
    embed_dim: 128
    similarity_threshold: 0.7
    lr: 1.0e-4

  semantic_memory:
    capacity: 512
    embed_dim: 128
    lr: 5.0e-5

  procedural_memory:
    capacity: 256
    embed_dim: 128
    lr: 1.0e-4

# --- Causal Discovery (experience mode, carry-forward) ---
causal_discovery:
  enabled: true
  mode: "experience"
  buffer_capacity: 4096
  intervene_every: 250
  max_edges: 512
  min_intervention_effect: 0.02
  min_strength: 0.02

# --- Number Sense ---
number_sense:
  enabled: true
  max_count: 20
  hidden: 32
  lr: 3.0e-4

# --- Rule Induction ---
rule_induction:
  enabled: true
  max_rules: 128
  max_chain_depth: 5
  min_confidence: 0.3
  induction_min_positive: 3

# --- Skills (carry-forward) ---
skills:
  skill_d_out: 128
  skill_d_in: 128
  skill_rank: 8
  gpu_capacity: 256
  cpu_capacity: 2048
  ssd_max_shards: 64
  ssd_shard_size: 128
  merge_similarity_threshold: 0.9
  score_alpha: 1.0
  score_beta: 0.5
  score_gamma: 0.1
  archive_subdir: "skills"

# --- World Model (KEY CHANGE: recon re-enabled for 3D) ---
world_model:
  z_dim: 32
  h_dim: 64
  embed_dim: 64
  hidden: 128
  max_rollout_steps: 10
  kl_free_nats: 0.0           # keep from Stage 14 (encoder must pay for laziness)
  recon_loss_weight: 1.0      # KEY: re-enable pixel recon (was 0.0 in latent-only)
                                # 3D pixels have enough information for encode < gain
  recon_pixel_weight: 200.0   # MSE weight: informative pixels get ~9x gradient
  next_loss_coef: 2.0
  update_every_steps: 4
  lr: 5.0e-4
  wm_loss_coef: 1.0
  log_every_steps: 1000       # more frequent logging for smoke test

intrinsic:
  embed_dim: 128
  lr: 1.0e-4
  reward_clip: 5.0
  reward_coef: 0.5
  update_every_steps: 1

replay:
  hot_capacity: 16384
  warm_capacity: 131072
  cold_max_shards: 32
  cold_shard_size: 16384
  per_alpha: 0.6
  min_size_to_sample: 1024
  sample_every_steps: 4
  batch_size_offpolicy: 128
  archive_subdir: "replay"

coverage:
  num_buckets: 16384
  log_every_steps: 5000

# --- Training (smoke test: 50K steps) ---
train:
  ppo_clip: 0.2
  ppo_epochs: 4
  entropy_coef: 0.04
  value_coef: 0.5
  gamma: 0.99
  gae_lambda: 0.95
  total_steps: 50000          # smoke test (full run would be 1M+)
  ckpt_every_steps: 10000

independent_eval:
  eval_every_steps: 10000
  eval_weights: [2.0, 1.0, 2.0]
  episodes_per_task: 10       # fewer for smoke test
  max_steps_per_ep: 200
  eval_epsilon: 0.05
  eval_seed: 42

viz:
  frame_every_steps: 5000     # save rendered frames for visual inspection
