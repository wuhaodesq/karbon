# Stage 14 · Causal Reasoning (因果发现 + 反事实想象)
# Delivers causal graph discovery via counterfactual intervention,
# tool-use chain environments, and multi-step causal reasoning.
#
# Key additions vs Stage 13:
# 1. CounterfactualImagination: "what if I had done X?" regret computation
# 2. Enhanced CausalDiscovery: more frequent interventions, larger graph
# 3. Tool-use chain curriculum: RedBlueDoors (multi-step key→door→navigate)
# 4. Eval with noise: deterministic eval may under-report success (sr=0.00 in S13)
# 5. Lowered surprise gate: episodic memory was underutilized in S13 (4%)
# 6. World model tuning: more frequent updates to improve RSSM learning

stage: 14
name: "stage14_causal_reasoning"

model:
  hidden_size: 128
  use_hierarchical: true
  use_hybrid_backbone: false
  hybrid_n_layers: 7
  hybrid_n_heads: 4
  hybrid_swa_window: 16
  hybrid_ttt_mini_batch: 8
  hybrid_ffn_hidden_mult: 4
  hybrid_dropout: 0.0
  use_slot_attention: true
  slot_num_slots: 7
  slot_dim: 128
  slot_num_iterations: 3
  use_vision_encoder: false
  sub_goal_every: 10

env:
  id: "MiniGrid-DoorKey-5x5-v0"
  render_size: 64
  action_force: 50.0
  num_envs: 1

# --- LLM Fusion ---
llm_fusion:
  enabled: true
  model: "Qwen/Qwen2.5-7B-Instruct"
  max_new_tokens: 64
  call_interval_steps: 50

# --- Advanced Cognition (Stage 14 additions) ---
advanced:
  counterfactual_enabled: true
  counterfactual_max_steps: 5
  counterfactual_every_steps: 500
  behavior_cloning_enabled: false
  meta_learner_enabled: false

# --- Cognitive Modules ---
cognitive:
  symbolic_enabled: true
  symbolic_max_rules: 64
  symbolic_bias_weight: 0.5
  self_model_enabled: true
  self_model_d_model: 384
  self_model_hidden: 64
  logic_engine_enabled: true
  logic_max_rules: 64
  logic_max_variables: 16
  reflection_enabled: true
  reflection_max: 256
  reflection_every_episodes: 200

theory_of_mind:
  enabled: false

creativity:
  enabled: true
  trigger_every_steps: 20000
  divergent_generator_enabled: true
  transformational_enabled: true
  transformational_max: 32

# --- MiniGrid curriculum (tool-use chain tasks) ---
curriculum:
  max_tasks: 5
  lp_window_size: 32
  lp_min_samples: 8
  exploration_epsilon: 0.3
  mode: sequential
  smoothing: 0.5
  switch_every_steps: 50000
  report_every_steps: 500
  tasks:
    - {id: 0, env_id: "MiniGrid-Empty-5x5-v0",       difficulty: 0.1, tag: "empty-5x5",       switch_every: 20000}
    - {id: 1, env_id: "MiniGrid-Empty-8x8-v0",       difficulty: 0.3, tag: "empty-8x8",       switch_every: 20000}
    - {id: 2, env_id: "MiniGrid-DoorKey-5x5-v0",      difficulty: 0.5, tag: "doorkey-5x5",     switch_every: 50000}
    - {id: 3, env_id: "MiniGrid-DoorKey-6x6-v0",      difficulty: 0.6, tag: "doorkey-6x6",     switch_every: 50000}
    - {id: 4, env_id: "MiniGrid-RedBlueDoors-6x6-v0", difficulty: 0.8, tag: "redbluedoors",    switch_every: 80000}

# --- Core modules ---
continual:
  ewc_lambda: 3.0
  ewc_gamma: 0.95
  ewc_anchor_mode: "replace"
  ewc_anchor_ema_alpha: 0.9
  ewc_consolidate_every_steps: 100000
  ewc_consolidate_num_batches: 32
  ewc_batch_size: 32
  gr_enabled: true
  gr_latent_dim: 64
  gr_hidden: 128
  gr_lr: 1.0e-3
  gr_kl_weight: 1.0
  gr_update_every_steps: 16
  gr_batch_size: 32
  gr_rehearsal_batch_size: 32
  gr_inject_every_steps: 5000
  sleep_warmup_steps: 1000
  sleep_replay_trim_every: 10000
  sleep_skills_merge_every: 20000
  sleep_ttt_distill_every: 20000

core_knowledge_loss:
  enabled: true
  coef_object_permanence: 0.1
  coef_intuitive_physics: 0.1
  coef_number_sense: 0.1

# --- External Memory System ---
external_memory:
  enabled: true

  surprise_detector:
    rnd_weight: 0.3
    rssm_weight: 0.3
    coverage_weight: 0.2
    td_weight: 0.2
    smoothing: 0.9

  episodic_replay:
    cold_archive_dir: "data/episodic_archive"
    cold_max_shards: 64
    cold_shard_size: 4096
    store_threshold: 1.0        # relaxed from 1.5 → fill episodic memory faster

developmental_memory:
  enabled: true
  d_model: 128
  episodic_max: 10000
  semantic_max: 1000
  autobiographical_max: 100
  surprise_threshold: 0.01
  consolidation_every_steps: 50000
  consolidation_batch_size: 256
  episodic_replay_batch_size: 64
  episodic_replay_every_steps: 8

# --- Imagination: deferred to Stage 12 (after Stage 14) ---
imagination:
  enabled: false

homeostatic_drives:
  enabled: true
  curiosity_decay: 0.002
  competence_decay: 0.001
  social_decay: 0.003
  safety_decay: 0.001
  rest_decay: 0.005

emotion_system:
  enabled: true
  pleasure_decay: 0.01
  frustration_decay: 0.02
  surprise_decay: 0.05
  fear_decay: 0.03

# --- Stage 14: Enhanced Causal Discovery ---
causal_discovery:
  enabled: true
  max_edges: 512
  min_intervention_effect: 0.005
  intervene_every_steps: 250

number_sense:
  enabled: true
  max_count: 20
  hidden: 32
  lr: 3.0e-4

rule_induction:
  enabled: true
  max_rules: 128
  max_chain_depth: 5
  min_confidence: 0.3
  induction_min_positive: 3

skills:
  skill_d_out: 128
  skill_d_in: 128
  skill_rank: 8
  gpu_capacity: 256
  cpu_capacity: 2048
  ssd_max_shards: 64
  ssd_shard_size: 128
  merge_similarity_threshold: 0.9
  score_alpha: 1.0
  score_beta: 0.5
  score_gamma: 0.1
  archive_subdir: "skills"

world_model:
  z_dim: 32
  h_dim: 64
  embed_dim: 64
  hidden: 128
  max_rollout_steps: 10
  kl_free_nats: 0.5
  update_every_steps: 4          # increased from 8 → more WM updates to help it learn
  lr: 5.0e-4                    # slightly higher LR for WM
  wm_loss_coef: 1.0
  log_every_steps: 5000

intrinsic:
  embed_dim: 128
  lr: 1.0e-4
  reward_clip: 5.0
  reward_coef: 0.5
  update_every_steps: 1

replay:
  hot_capacity: 16384
  warm_capacity: 131072
  cold_max_shards: 32
  cold_shard_size: 16384
  per_alpha: 0.6
  min_size_to_sample: 1024
  sample_every_steps: 4
  batch_size_offpolicy: 128
  archive_subdir: "replay"

coverage:
  num_buckets: 16384
  log_every_steps: 5000

train:
  ppo_clip: 0.2
  ppo_epochs: 4
  entropy_coef: 0.04
  value_coef: 0.5
  gamma: 0.99
  gae_lambda: 0.95
  total_steps: 1000000
  ckpt_every_steps: 25000

independent_eval:
  eval_every_steps: 25000
  eval_weights: [2.0, 1.0, 2.0]
  episodes_per_task: 5
  max_steps_per_ep: 200
  eval_epsilon: 0.05

viz:
  frame_every_steps: 0
